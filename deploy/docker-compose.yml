# 对外部署编排（服务器 /opt/buchuqin/ 下运行）
# 用法：deploy/deploy.sh 会把本文件复制到 /opt/buchuqin/docker-compose.yml
# 目录约定：
#   /opt/buchuqin/buchuqin-api/   ← git clone 的本仓库
#   /opt/buchuqin/admin-dist/     ← 兜底通道：admin 构建产物副本（生产静态真身在 1Panel 站点目录，见下）
#   /opt/buchuqin/.env            ← 环境变量（不入 git）
# 80/443 由 OpenResty（host 网络）持有，本编排把 api 发布到 127.0.0.1:8080（仅本机），
# 由 OpenResty 反代 admin.buchuqin.com（IKC9M2 迁移 106.52.167.181）。
# 数据库：使用 1Panel 安装的 PostgreSQL（容器 1Panel-postgresql-fC0e，主机名经 .env 的
# PSQL_HOST 注入），本编排不再自带 postgres 服务（2026-08-31 迁移新机后调整）。
# admin 静态真身 = /opt/1panel/www/sites/buchuqin.nongmokeji.com/index/（OpenResty 直出，发布走 tar 管道）；
# 本编排挂载的 admin-dist 只是 Nest 兜底通道，不再是发布目标（2026-08-24 部署踩坑后更正此注释）
name: buchuqin

services:
  api:
    build: ./buchuqin-api
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_DIST_DIR: /app/admin-dist
      # DATABASE_URL 单源化：密码只存 POSTGRES_PASSWORD 一份，compose 在此拼接注入。
      # compose 的 environment 优先级高于 env_file，会覆盖 .env 里的同名键。
      DATABASE_URL: postgresql://buchuqin:${POSTGRES_PASSWORD}@${PSQL_HOST}:5432/buchuqinshishe?schema=public
    volumes:
      - ./admin-dist:/app/admin-dist:ro
    ports:
      # 宿主机 8080 → 容器内 3000（2026-08-18 域名化改造，安全组/防火墙不对公网开此端口）
      - '127.0.0.1:8080:3000'
    # alpine 无 curl，用 node 内置 fetch 探活（/api/v1/health 含数据库连通性检查）
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - 1panel-network

networks:
  1panel-network:
    external: true
