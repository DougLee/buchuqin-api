# 对外部署编排（服务器 /opt/buchuqin/ 下运行）
# 用法：deploy/deploy.sh 会把本文件复制到 /opt/buchuqin/docker-compose.yml
# 目录约定：
#   /opt/buchuqin/buchuqin-api/   ← git clone 的本仓库
#   /opt/buchuqin/admin-dist/     ← buchuqin-admin 构建产物（本地 pnpm build 后 scp 上来）
#   /opt/buchuqin/.env            ← 环境变量（不入 git）
# 80/443 由 1Panel 的 OpenResty（host 网络）持有，本编排只把 api 发布到 127.0.0.1:3000，
# 由 OpenResty 反代；admin 静态站由 api 容器经 ADMIN_DIST_DIR 挂载托管
name: buchuqin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buchuqin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: buchuqinshishe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buchuqin -d buchuqinshishe']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./buchuqin-api
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_DIST_DIR: /app/admin-dist
      # DATABASE_URL 单源化：密码只存 POSTGRES_PASSWORD 一份，compose 在此拼接注入。
      # compose 的 environment 优先级高于 env_file，会覆盖 .env 里的同名键。
      DATABASE_URL: postgresql://buchuqin:${POSTGRES_PASSWORD}@postgres:5432/buchuqinshishe?schema=public
    volumes:
      - ./admin-dist:/app/admin-dist:ro
    ports:
      - '127.0.0.1:3000:3000'
    # alpine 无 curl，用 node 内置 fetch 探活（/api/v1/health 含数据库连通性检查）
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
