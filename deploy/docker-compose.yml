# 对外部署编排（服务器 /opt/buchuqin/ 下运行）
# 用法：deploy/deploy.sh 会把本文件复制到 /opt/buchuqin/docker-compose.yml
# 目录约定：
#   /opt/buchuqin/buchuqin-api/   ← git clone 的本仓库
#   /opt/buchuqin/admin-dist/     ← buchuqin-admin 构建产物（本地 pnpm build 后 scp 上来）
#   /opt/buchuqin/.env            ← 环境变量（不入 git）
name: buchuqin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buchuqin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: buchuqinshishe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buchuqin -d buchuqinshishe']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./buchuqin-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
