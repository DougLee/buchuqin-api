# 不出寝食社·独立部署编排（api+admin 两容器，库用 1Panel 管的 PostgreSQL）
# 参考 dancikeji 部署模板（道哥 2026-10-11）适配本项目：
#   1) 无 redis——本项目 api 零 redis 引用（JWT 无状态会话）；
#   2) 无 db 服务——数据库是 1Panel 应用商店装的 PostgreSQL（外部容器），
#      经 external 网络 1panel-network 按容器名互访，与 /opt/buchuqin 主编排同一约定；
#   3) admin 容器化（vue 服务）——不再依赖 openresty 站点目录，自带 nginx
#      静态直出 + /api/v1 同源反代 nest，对外只发布 vue 一个端口；
#   4) api 日志走 docker logs（stdout），无 LOG_DIR 文件落盘。
#
# 用法（服务器上，与主编排同机共库时）：
#   git clone git@gitee.com:buchuqin-group/buchuqin-api.git
#   git clone git@gitee.com:buchuqin-group/buchuqin-admin.git
#   cp buchuqin-api/deploy/docker-compose-standalone.yml docker-compose.yml
#   cp buchuqin-api/.env.example .env && vim .env
#     # 必填：POSTGRES_PASSWORD / JWT_SECRET / PSQL_HOST=<1Panel 的 PG 容器名> / COS_* / WX_*
#   docker network create 1panel-network   # 已存在会报错，忽略
#   docker compose up -d --build
#
# ⚠️ 指向的 1Panel PG 里需已建 buchuqin 角色 + buchuqinshishe 库并灌好数据
#   （空库冷启动会卡在历史迁移依赖倒挂，见部署踩坑记录·坑4）。
version: "3.1"

services:
  nest:
    build: ./buchuqin-api
    restart: always
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL 单源化拼接（与主编排同一约定）：PSQL_HOST=1Panel 的 PG 容器名
      DATABASE_URL: postgresql://buchuqin:${POSTGRES_PASSWORD}@${PSQL_HOST}:5432/buchuqinshishe?schema=public
    env_file: .env
    # 启动自动 migrate deploy（见 Dockerfile CMD）
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - 1panel-network

  vue:
    build: ./buchuqin-admin
    restart: always
    depends_on:
      - nest
    environment:
      TZ: Asia/Shanghai
    ports:
      # 对外发布端口，按机器规划改左侧（右侧 80 是容器内 nginx，/api/v1 内部反代 nest）
      - 20010:80
    networks:
      - default

networks:
  1panel-network:
    external: true
